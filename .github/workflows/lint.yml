name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build lint container
        run: docker build -t resume-lint linting
      - name: Run all linters
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace:ro" resume-lint
