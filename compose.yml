services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - stagit_www:/www:ro
    depends_on:
      - cv

  cv:
    build: ./cv
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./cv/main.py
          target: /app/main.py
        - action: sync
          path: ./cv/index.html
          target: /app/index.html
        - action: sync
          path: ./cv/style.css
          target: /app/style.css
        - action: rebuild
          path: ./cv/Dockerfile
        - action: rebuild
          path: ./cv/requirements.txt

  stagit:
    build: ./stagit
    restart: unless-stopped
    init: true
    volumes:
      - ./stagit:/config:ro
      - stagit_git:/git
      - stagit_www:/www

volumes:
  stagit_git:
  stagit_www:
