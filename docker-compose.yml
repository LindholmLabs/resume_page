services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - cv

  cv:
    build: ./app
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./app/main.py
          target: /app/main.py
        - action: sync
          path: ./app/index.html
          target: /app/index.html
        - action: sync
          path: ./app/style.css
          target: /app/style.css
        - action: rebuild
          path: ./app/Dockerfile
        - action: rebuild
          path: ./app/requirements.txt
